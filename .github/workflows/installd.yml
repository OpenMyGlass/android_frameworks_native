# SPDX-License-Identifier: Apache-2.0
# OpenMyGlass: checks for our installd changes (ART only, dex2oat filters). The full AOSP build
# runs from OpenMyGlass/manifest; this job only needs a host compiler and pinned AOSP headers.
name: installd
on:
  push:
    branches: [glass-4.4]
  pull_request:
permissions:
  contents: read
jobs:
  installd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # android-security/android_system_core aosp-4.4, as pinned in OpenMyGlass/manifest.
      SYSTEM_CORE_REPO: https://github.com/android-security/android_system_core
      SYSTEM_CORE_COMMIT: f8b2fe863354f13d12077a29390a8ba991954feb
      # platform/external/libselinux at android-4.4.4_r2.0.1.
      LIBSELINUX_REPO: https://android.googlesource.com/platform/external/libselinux
      LIBSELINUX_COMMIT: 8b4760949bbafdee6f7825f39423f3db745f4115
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Filter selection, host test
        run: |
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined -I cmds/installd \
            -o "$RUNNER_TEMP/glass_dex2oat_test" \
            cmds/installd/glass_dex2oat.c cmds/installd/tests/glass_dex2oat_test.c
          "$RUNNER_TEMP/glass_dex2oat_test"
      - name: Fetch pinned AOSP headers
        run: |
          fetch() {
            git init -q "$2"
            git -C "$2" fetch -q --depth=1 "$1" "$3"
            git -C "$2" checkout -q FETCH_HEAD
            test "$(git -C "$2" rev-parse HEAD)" = "$3"
          }
          fetch "$SYSTEM_CORE_REPO" "$RUNNER_TEMP/system_core" "$SYSTEM_CORE_COMMIT"
          fetch "$LIBSELINUX_REPO" "$RUNNER_TEMP/libselinux" "$LIBSELINUX_COMMIT"
      - name: Cache the NDK zip
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ndk.zip
          key: ndk-r25c-769ee342ea75f80619d985c2da990c48b3d8eaf45f48783a2d48870d04b46108
      - name: Fetch the pinned NDK (r25c, the newest with API 19)
        run: |
          zip=$RUNNER_TEMP/ndk.zip
          sum=769ee342ea75f80619d985c2da990c48b3d8eaf45f48783a2d48870d04b46108
          if ! echo "$sum  $zip" | sha256sum -c --status -; then
            curl -fsSL --retry 3 -o "$zip" https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
            echo "$sum  $zip" | sha256sum -c -
          fi
          unzip -q "$zip" 'android-ndk-r25c/toolchains/llvm/*' -d "$RUNNER_TEMP"
          echo "CC_ARM=$RUNNER_TEMP/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi19-clang" >> "$GITHUB_ENV"
      - name: Compile commands.c and installd.c for the device (syntax and warnings)
        run: |
          # HAVE_SYS_UIO_H and HAVE_ANDROID_OS come from 4.4's force-included AndroidConfig.h
          # (build/core/combo/include/arch/linux-arm) in a real build.
          for f in cmds/installd/commands.c cmds/installd/installd.c cmds/installd/glass_dex2oat.c; do
            "$CC_ARM" -std=gnu99 -fsyntax-only -Wall -Werror=implicit-function-declaration \
              -Werror=incompatible-pointer-types -Werror=int-conversion \
              -Werror=unused-function -Werror=unused-variable \
              -DHAVE_SYS_UIO_H -DHAVE_ANDROID_OS=1 \
              -I cmds/installd -I "$RUNNER_TEMP/system_core/include" \
              -I "$RUNNER_TEMP/libselinux/include" "$f"
          done
      - name: No dexopt path left in installd
        run: |
          ! grep -n 'run_dexopt\|/system/bin/dexopt\|"libdvm' cmds/installd/commands.c
